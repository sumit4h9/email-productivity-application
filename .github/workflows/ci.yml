name: CI Pipeline

on:
  push:
    branches: ["*"]         
  pull_request:
    branches: ["main"]      

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: |
          cd backend/app
          pip install -r requirements.txt

      - name: Check backend code formatting
        run: |
          cd backend/app
          black --check .
          isort --check-only .
          flake8 .

      - name: Run backend tests
        run: |
          cd backend
          PYTHONPATH=app pytest -v

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install frontend dependencies
        run: |
          cd frontend/app
          npm install

      - name: Check code formatting
        run: |
          cd frontend/app
          npm run format:check

      - name: Lint frontend
        run: |
          cd frontend/app
          npm run lint

      - name: Run frontend tests
        run: |
          cd frontend/app
          npm test

  ml-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install ML service dependencies
        run: |
          cd ml
          pip install -r requirements.txt

      - name: Check ML service code formatting
        run: |
          cd ml
          black --check .
          isort --check-only .
          flake8 .

      - name: Run ML service tests
        run: |
          cd ml
          PYTHONPATH=.. pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, ml-tests] # ✅ wait for all tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build backend Docker image
        run: docker build -f backend/app/Dockerfile -t myapp-backend ./backend

      - name: Build frontend Docker image
        run: docker build -f frontend/app/Dockerfile -t myapp-frontend ./frontend

      - name: Build ML Docker image
        run: docker build -t myapp-ml ./ml
