name: CI Pipeline

on:
  push:
    branches: ["*"]         
  pull_request:
    branches: ["main"]      

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build backend Docker image
        run: docker build -f backend/app/Dockerfile -t myapp-backend ./backend

      - name: Build frontend Docker image
        run: docker build -f frontend/app/Dockerfile -t myapp-frontend ./frontend

