services:
  # ---------- DEV DATABASES ----------
  postgres:
    image: postgres:15
    profiles: ["dev"]
    environment:
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: myapp_pass
      POSTGRES_DB: myapp_db
    ports:
      - "5434:5432"
    volumes:
      - infra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    profiles: ["dev"]
    ports:
      - "6381:6379"
    volumes:
      - infra_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    profiles: ["dev"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - infra_minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    profiles: ["dev"]
    ports:
      - "1025:1025"
      - "8025:8025"

  # ---------- PROD DATABASES ----------
  db:
    image: postgres:16-alpine
    profiles: ["prod"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_prod:
    image: redis:7-alpine
    profiles: ["prod"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- BACKEND ----------
  backend_dev:
    build:
      context: ./backend
      dockerfile: app/Dockerfile
    environment:
      PYTHONPATH: /
      DATABASE_URL: 
      REDIS_URL: 
      JWT_SECRET_KEY: 
      JWT_ISSUER: 
      JWT_AUDIENCE: 
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # Email configuration for MailHog
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USERNAME: "user"
      SMTP_PASSWORD: "user"
      SMTP_USE_TLS: "false"
      SMTP_USE_SSL: "false"
      SMTP_DEBUG: "false"
      FRONTEND_URL: http://localhost:3000
      # MinIO storage configuration
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_BUCKET_NAME: email-attachments
      MINIO_REGION: us-east-1
      # Google OAuth configuration
      GOOGLE_CLIENT_ID: 
      GOOGLE_CLIENT_SECRET: 
      GOOGLE_REDIRECT_URI: http://localhost:3000/auth/google/callback
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles: ["dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      minio:
        condition: service_started

  backend_prod:
    build:
      context: ./backend
      dockerfile: app/Dockerfile
    env_file: .env
    environment:
      PYTHONPATH: /
      DATABASE_URL: 
      REDIS_URL: 
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    profiles: ["prod"]
    depends_on:
      db:
        condition: service_healthy
      redis_prod:
        condition: service_healthy

  # ---------- FRONTEND ----------
  frontend:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/app:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    command: >
      sh -lc "npm install --legacy-peer-deps &&
      npm rebuild lightningcss || true &&
      npm run dev"
    depends_on:
      - backend_dev
    profiles: ["dev"]

  frontend_prod:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile.dev
    env_file: .env
    ports:
      - "3000:3000"
    command: npm run start
    depends_on:
      - backend_prod
    profiles: ["prod"]

  # ---------- ML SERVICE ----------
  ml_dev:
    build:
      context: ./ml
      dockerfile: Dockerfile
    environment:
      DATABASE_URL:
      REDIS_URL: 
    ports:
      - "8500:8500"
    volumes:
      - ./ml:/app
      - /app/__pycache__
    command: uvicorn main:app --host 0.0.0.0 --port 8500 --reload
    depends_on:
      - backend_dev
    profiles: ["dev"]

  ml_prod:
    build:
      context: ./ml
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8500:8500"
    command: uvicorn main:app --host 0.0.0.0 --port 8500
    depends_on:
      - backend_prod
    profiles: ["prod"]

volumes:
  infra_pgdata:
  infra_redis_data:
  infra_minio_data:
  pgdata:
  redis_data:
